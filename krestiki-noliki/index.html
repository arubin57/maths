<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крестики-нолики</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,system-ui,sans-serif}
:root{--bg:#0a1224;--panel:#15223b;--outline:#3b547b;--blue:#69c8ff;--gold:#ffd170}
body{color:#f4f7ff;background:radial-gradient(circle at 10% 10%,#263b69,transparent 36%),var(--bg)}
button,input{font:inherit}button{cursor:pointer}
#lock{position:fixed;inset:0;z-index:50;background:#0a1224;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{width:min(420px,100%);padding:32px;border:1px solid var(--outline);border-radius:20px;background:var(--panel);text-align:center;box-shadow:0 24px 90px #0008}
.lock-card h1{margin:0 0 12px;font-size:28px}.lock-card p{color:#bdcbe3}
#pin{display:block;width:100%;font-size:32px;letter-spacing:.4em;text-align:center;color:white;background:#223451;border:1px solid #7891bd;border-radius:12px;padding:13px;margin:20px auto}
#enter{width:100%;padding:14px;border:0;border-radius:12px;background:#4b87d2;color:white;font-weight:bold}
#error{min-height:24px;margin-top:12px;color:#ffadad}
#app{display:none;width:100%;min-height:100vh;padding:clamp(12px,1.5vw,26px);flex-direction:column;gap:13px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px}
header h1{font-size:clamp(26px,2.7vw,45px);margin:0;line-height:1.1}
header p{margin:8px 0 0;color:#b5c4dc;font-size:clamp(12px,1.15vw,18px)}
.topbtn{padding:12px 16px;background:#294267;border:1px solid #58729d;border-radius:13px;color:white;font-weight:bold;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0, 1.5fr) minmax(310px, 1fr);gap:16px;flex:1;min-height:0}
.surface{background:#111c32;border:1px solid #324b70;border-radius:22px;min-width:0}
.board-panel{display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
#board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:8px;width:min(100%,calc((100dvh - 155px)*5/6));aspect-ratio:5 / 6;max-height:calc(100dvh - 155px);min-height:0}
.cell{min-width:0;min-height:0;aspect-ratio:1;background:#233451;border:1px solid #50678f;border-radius:12px;font-size:clamp(22px,5vh,66px);color:white;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:800;padding:0}
.cell.x{color:var(--blue);background:#122b45}.cell.o{color:var(--gold);background:#382f24}.cell.win{box-shadow:inset 0 0 0 3px #68d2af}
.cell:disabled{cursor:default}
aside{padding:clamp(12px,1.5vw,24px);display:flex;flex-direction:column;gap:12px;justify-content:center}
.score{background:#223453;border:1px solid #476087;border-radius:14px;padding:clamp(12px,1.3vw,22px);display:flex;align-items:center;gap:16px}
.mark{font-weight:900;font-size:clamp(38px,4vw,66px);line-height:1}.xtext{color:var(--blue)}.otext{color:var(--gold)}
.muted{color:#bdcbe1;font-size:clamp(13px,1.1vw,17px)}
.points{font-size:clamp(26px,2.6vw,42px);font-weight:800;line-height:1.15}
.turn{border:1px solid #476087;background:#1c2b47;border-radius:14px;padding:clamp(12px,1.3vw,20px)}
#current{font-size:clamp(23px,2.2vw,36px);font-weight:800}
#message{color:#83e2ba;margin-top:6px;min-height:18px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{background:#2d476c;border:1px solid #5977a4;color:white;font-weight:700;padding:clamp(12px,1.2vw,17px);border-radius:12px}
.actions button:disabled{opacity:.4;cursor:default}
.actions button:last-child{grid-column:1/-1;font-size:24px;line-height:1}
@media(max-width:850px),(max-aspect-ratio:1/1){main{grid-template-columns:1fr}.board-panel{min-height:0}#board{width:min(100%,460px);max-height:none}aside{justify-content:flex-start}#app{min-height:100vh}}
@media(max-height:650px) and (min-width:851px){#app{gap:8px;padding:10px}#board{width:min(100%,calc((100dvh - 115px)*5/6));max-height:calc(100dvh - 115px)}.score{padding:8px 13px}.turn{padding:9px 13px}.actions button{padding:10px}.mark{font-size:36px}.points{font-size:26px}}
</style></head>
<body>
<section id="lock"><form class="lock-card" id="gate"><h1>Крестики-нолики</h1><p>Введите четырёхзначный код для запуска игры.</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Пароль" required><button id="enter" type="submit">Открыть игру</button><div id="error" role="status"></div></form></section>
<div id="app"><header><div><h1>Крестики <span class="xtext">×</span> и нолики <span class="otext">○</span></h1><p>Цель каждой команды — набрать не менее 3 очков. Одно очко — 5 своих знаков подряд по горизонтали или вертикали.</p></div><button class="topbtn" id="fullscreen">⛶ На весь экран</button></header>
<main><section class="surface board-panel"><div id="board" aria-label="Поле 5 столбцов и 6 строк"></div></section>
<aside class="surface"><div class="score"><span class="mark xtext">×</span><div><div class="muted">Крестики</div><div class="points" id="scoreX">0 очков</div><div class="muted" id="goalX">Цель: 0 / 3</div></div></div>
<div class="score"><span class="mark otext">○</span><div><div class="muted">Нолики</div><div class="points" id="scoreO">0 очков</div><div class="muted" id="goalO">Цель: 0 / 3</div></div></div>
<div class="turn"><div class="muted">Сейчас ходят</div><div id="current">Крестики ×</div><div id="message" aria-live="polite"></div></div>
<div class="actions"><button id="undo">↶ Отменить ход</button><button id="reset">↻ Новая игра</button><button id="demo" aria-label="Дополнительное действие">◈</button></div>
</aside></main></div>
<script>
const gate=document.getElementById('gate'),pin=document.getElementById('pin'),lock=document.getElementById('lock'),app=document.getElementById('app');
gate.addEventListener('submit',e=>{e.preventDefault();if(pin.value==='0000'){lock.style.display='none';app.style.display='flex';pin.value='';render()}else{document.getElementById('error').textContent='Неверный код';pin.value='';pin.focus()}});
const ROWS=6,COLS=5;let cells=Array(ROWS*COLS).fill(''),turn='X',history=[];
const lines=[];
for(let r=0;r<ROWS;r++)lines.push(Array.from({length:5},(_,k)=>r*COLS+k));
for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS-5;r++)lines.push(Array.from({length:5},(_,k)=>(r+k)*COLS+c));
const el=id=>document.getElementById(id);
function scores(){let s={X:0,O:0},win=new Set();for(const line of lines){let mark=cells[line[0]];if(mark&&line.every(i=>cells[i]===mark)){s[mark]++;line.forEach(i=>win.add(i))}}return {s,win}}
function word(n){return n%10===1&&n%100!==11?'очко':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'очка':'очков'}
function render(){let {s,win}=scores();el('board').replaceChildren();cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(v?' '+v.toLowerCase():'')+(win.has(i)?' win':'');b.textContent=v==='X'?'×':v==='O'?'○':'';b.disabled=!!v;b.title='Строка '+(Math.floor(i/COLS)+1)+', столбец '+(i%COLS+1);b.addEventListener('click',()=>move(i));el('board').append(b)});el('scoreX').textContent=s.X+' '+word(s.X);el('scoreO').textContent=s.O+' '+word(s.O);el('goalX').textContent='Цель: '+s.X+' / 3';el('goalO').textContent='Цель: '+s.O+' / 3';el('current').textContent=turn==='X'?'Крестики ×':'Нолики ○';el('undo').disabled=!history.length;el('message').textContent=s.X>=3&&s.O>=3?'Обе команды выполнили цель.':s.X>=3?'Крестики выполнили цель.':s.O>=3?'Нолики выполнили цель.':''}
function move(i){if(cells[i])return;history.push({cells:[...cells],turn});cells[i]=turn;turn=turn==='X'?'O':'X';render()}
function reset(){history=[];cells=Array(ROWS*COLS).fill('');turn='X';render()}
el('undo').onclick=()=>{let x=history.pop();if(x){cells=x.cells;turn=x.turn;render()}};
el('reset').onclick=reset;
el('demo').onclick=()=>{history=[];cells=Array(ROWS*COLS).fill('');for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells[r*COLS+c]=r%2===0?'X':'O';turn='X';render()};
el('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
</script></body></html>
