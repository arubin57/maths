<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математика</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(#ffffff,#f7fbff);
    color:#1f2937;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{width:min(900px,96vw);text-align:center}
  h1{font-size:clamp(34px,6vw,64px);margin:0 0 12px}
  p{font-size:clamp(17px,2.2vw,22px);color:#6b7280;margin:0 0 34px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  a.card{
    display:block;text-decoration:none;color:inherit;background:white;
    border:2px solid #e5e7eb;border-radius:20px;padding:28px 24px;
    box-shadow:0 8px 24px rgba(31,41,55,.08);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(31,41,55,.12)}
  .title{font-size:28px;font-weight:800;margin-bottom:8px}
  .desc{font-size:17px;color:#6b7280}
</style>
</head>
<body>
<div class="wrap">
  <h1>Математика</h1>
  <p>Интерактивные материалы для уроков</p>
  <div class="cards">
    <a class="card" href="razryady/">
      <div class="title">Разряды числа</div>
      <div class="desc">Сотни, десятки и единицы</div>
    </a>
  </div>
</div>
</body>
</html>
